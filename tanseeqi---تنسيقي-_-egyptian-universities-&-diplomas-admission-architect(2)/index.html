    <script>
      // Silently ignore WebSocket and HMR transport errors when HMR is disabled in AI Studio
      window.addEventListener('error', function(e) {
        var msg = e && (e.message || (e.error && e.error.message)) ? String(e.message || e.error.message) : '';
        if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || msg.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason) ? String(e.reason.message || e.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('createWebSocketModuleRunnerTransport') || reason.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
  </head>
